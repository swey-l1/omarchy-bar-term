<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Alt is the pad's, everything else is the shell's</title>
  <desc id="desc">The pad answers Escape and Alt: Alt+S lists sessions, Alt+T attaches one to a terminal, Alt+K restarts it, Alt and the arrows or numbers move between tabs. Every other key is typed into the tmux session, so Tab completes, Enter runs, Up walks the shell's history, and Ctrl+C, Ctrl+L, Ctrl+R and Ctrl+W do what they do in any terminal.</desc>
  <rect x="0" y="0" width="1200" height="400" rx="22" fill="#1A1B26"/>
  <text x="40" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#7AA2F7" letter-spacing="2.4">ALT IS THE PAD'S</text>
  <rect x="40" y="66" width="116" height="66" rx="8" fill="#24283B" stroke="#7AA2F7" stroke-width="1.2"/>
  <text x="98.0" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C0CAF5" text-anchor="middle">Esc</text>
  <text x="98.0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">close</text>
  <rect x="166" y="66" width="116" height="66" rx="8" fill="#24283B" stroke="#7AA2F7" stroke-width="1.2"/>
  <text x="224.0" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C0CAF5" text-anchor="middle">Alt+S</text>
  <text x="224.0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">sessions</text>
  <rect x="292" y="66" width="116" height="66" rx="8" fill="#24283B" stroke="#7AA2F7" stroke-width="1.2"/>
  <text x="350.0" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C0CAF5" text-anchor="middle">Alt+T</text>
  <text x="350.0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">attach</text>
  <rect x="418" y="66" width="116" height="66" rx="8" fill="#24283B" stroke="#7AA2F7" stroke-width="1.2"/>
  <text x="476.0" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C0CAF5" text-anchor="middle">Alt+K</text>
  <text x="476.0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">restart</text>
  <rect x="544" y="66" width="116" height="66" rx="8" fill="#24283B" stroke="#7AA2F7" stroke-width="1.2"/>
  <text x="602.0" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C0CAF5" text-anchor="middle">Alt+←</text>
  <text x="602.0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">prev tab</text>
  <rect x="670" y="66" width="116" height="66" rx="8" fill="#24283B" stroke="#7AA2F7" stroke-width="1.2"/>
  <text x="728.0" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C0CAF5" text-anchor="middle">Alt+→</text>
  <text x="728.0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">next tab</text>
  <rect x="796" y="66" width="116" height="66" rx="8" fill="#24283B" stroke="#7AA2F7" stroke-width="1.2"/>
  <text x="854.0" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C0CAF5" text-anchor="middle">Alt+1</text>
  <text x="854.0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">tab 1</text>
  <rect x="922" y="66" width="116" height="66" rx="8" fill="#24283B" stroke="#7AA2F7" stroke-width="1.2"/>
  <text x="980.0" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C0CAF5" text-anchor="middle">Alt+2</text>
  <text x="980.0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">tab 2</text>
  <rect x="40" y="142" width="116" height="66" rx="8" fill="#24283B" stroke="#7AA2F7" stroke-width="1.2"/>
  <text x="98.0" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C0CAF5" text-anchor="middle">Alt+3</text>
  <text x="98.0" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">tab 3</text>
  <rect x="166" y="142" width="116" height="66" rx="8" fill="#24283B" stroke="#7AA2F7" stroke-width="1.2"/>
  <text x="224.0" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C0CAF5" text-anchor="middle">Alt+4</text>
  <text x="224.0" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">tab 4</text>
  <text x="40" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#A9B1D6" letter-spacing="2.4">EVERYTHING ELSE IS THE SHELL'S</text>
  <rect x="40" y="288" width="116" height="66" rx="8" fill="#1A1B26" stroke="#565F89" stroke-width="1.2"/>
  <text x="98.0" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#A9B1D6" text-anchor="middle">Tab</text>
  <text x="98.0" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">completes</text>
  <rect x="166" y="288" width="116" height="66" rx="8" fill="#1A1B26" stroke="#565F89" stroke-width="1.2"/>
  <text x="224.0" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#A9B1D6" text-anchor="middle">Enter</text>
  <text x="224.0" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">runs</text>
  <rect x="292" y="288" width="116" height="66" rx="8" fill="#1A1B26" stroke="#565F89" stroke-width="1.2"/>
  <text x="350.0" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#A9B1D6" text-anchor="middle">Up</text>
  <text x="350.0" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">history</text>
  <rect x="418" y="288" width="116" height="66" rx="8" fill="#1A1B26" stroke="#565F89" stroke-width="1.2"/>
  <text x="476.0" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#A9B1D6" text-anchor="middle">Ctrl+C</text>
  <text x="476.0" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">interrupts</text>
  <rect x="544" y="288" width="116" height="66" rx="8" fill="#1A1B26" stroke="#565F89" stroke-width="1.2"/>
  <text x="602.0" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#A9B1D6" text-anchor="middle">Ctrl+L</text>
  <text x="602.0" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">clears</text>
  <rect x="670" y="288" width="116" height="66" rx="8" fill="#1A1B26" stroke="#565F89" stroke-width="1.2"/>
  <text x="728.0" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#A9B1D6" text-anchor="middle">Ctrl+R</text>
  <text x="728.0" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">searches</text>
  <rect x="796" y="288" width="116" height="66" rx="8" fill="#1A1B26" stroke="#565F89" stroke-width="1.2"/>
  <text x="854.0" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#A9B1D6" text-anchor="middle">Ctrl+W</text>
  <text x="854.0" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">kills a word</text>
  <rect x="922" y="288" width="116" height="66" rx="8" fill="#1A1B26" stroke="#565F89" stroke-width="1.2"/>
  <text x="980.0" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#A9B1D6" text-anchor="middle">…</text>
  <text x="980.0" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#565F89" text-anchor="middle">and the rest</text>
  <text x="40" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#565F89">Keys the pad does not answer are typed into the session, which is why completion, readline and the shell's own history work here.</text>
</svg>
