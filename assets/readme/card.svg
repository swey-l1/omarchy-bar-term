<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="548" viewBox="0 0 1200 548" role="img" aria-labelledby="title desc">
  <title id="title">Bar Terminal: a terminal session in the Omarchy bar</title>
  <desc id="desc">The marketplace card: the plugin's name, one line about what it is, and the pad drawn as it really looks, with output, a prompt, a key row and a tab strip.</desc>
  <rect x="0" y="0" width="1200" height="548" rx="0" fill="#1A1B26"/>
  <text x="72" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" fill="#7AA2F7" letter-spacing="4">OMARCHY BAR WIDGET</text>
  <text x="70" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="92" fill="#C0CAF5" font-weight="700">Bar Terminal</text>
  <text x="72" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" fill="#A9B1D6">A terminal session in the bar.</text>
  <text x="72" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" fill="#A9B1D6">Tabs are tmux sessions: they stay</text>
  <text x="72" y="394" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" fill="#A9B1D6">where you left them.</text>
  <rect x="72" y="440" width="96" height="5" rx="3" fill="#7AA2F7"/>
  <text x="72" y="492" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" fill="#565F89">QML + bash  ·  MIT</text>
  <g transform="translate(700 64) scale(1.4)">
  <rect x="0" y="0" width="300" height="300" rx="12" fill="#1A1B26" stroke="#7AA2F7" stroke-width="2"/>
  <rect x="12" y="12" width="276" height="150" rx="8" fill="#24283B"/>
  <text x="24" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A9B1D6">$ git log --oneline -2</text>
  <text x="24" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#565F89">c380bcf the session list</text>
  <text x="24" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#565F89">2150760 a picture of it</text>
  <text x="24" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7AA2F7">ok</text>
  <rect x="12" y="168" width="276" height="30" rx="6" fill="#24283B" stroke="#7AA2F7" stroke-width="1"/>
  <text x="24" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#565F89">command</text>
  <rect x="12" y="208" width="41" height="34" rx="6" fill="#24283B"/>
  <rect x="59" y="208" width="41" height="34" rx="6" fill="#24283B"/>
  <rect x="106" y="208" width="41" height="34" rx="6" fill="#24283B"/>
  <rect x="153" y="208" width="41" height="34" rx="6" fill="#24283B"/>
  <rect x="200" y="208" width="41" height="34" rx="6" fill="#24283B"/>
  <rect x="247" y="208" width="41" height="34" rx="6" fill="#24283B"/>
  <text x="23" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#A9B1D6">RUN</text>
  <rect x="12" y="252" width="64" height="26" rx="6" fill="#24283B"/>
  <text x="44" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#A9B1D6" text-anchor="middle">1 ~/src</text>
  <rect x="82" y="252" width="64" height="26" rx="6" fill="#1A1B26"/>
  <text x="114" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#565F89" text-anchor="middle">2 etc</text>
  <rect x="152" y="252" width="64" height="26" rx="6" fill="#1A1B26"/>
  <text x="184" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#565F89" text-anchor="middle">3 ~</text>
  <rect x="222" y="252" width="64" height="26" rx="6" fill="#1A1B26"/>
  <text x="254" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#565F89" text-anchor="middle">4</text>
  </g>
</svg>
