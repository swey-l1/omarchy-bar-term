<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Bar Terminal, an Omarchy bar widget</title>
  <desc id="desc">A terminal session in the Omarchy bar: tabs backed by tmux sessions, a prompt, the session's screen, and a key to attach any tab to a terminal window. The right side shows the pad as it draws: output, prompt, key row and tab strip.</desc>
  <rect x="0" y="0" width="1200" height="360" rx="26" fill="#1A1B26"/>
  <text x="64" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7AA2F7" letter-spacing="2">OMARCHY BAR WIDGET · TMUX</text>
  <text x="62" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" fill="#C0CAF5" font-weight="700">Bar Terminal</text>
  <text x="64" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#A9B1D6">tmux sessions in the bar. Type a command, read</text>
  <text x="64" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#A9B1D6">what it said, and carry on with what you were</text>
  <text x="64" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#A9B1D6">doing. Every tab stays where you left it.</text>
  <text x="64" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#565F89">QML + bash  ·  tmux sessions  ·  four tabs  ·  attach any of them  ·  MIT</text>
  <g transform="translate(840 30) scale(1.0)">
  <rect x="0" y="0" width="300" height="272" rx="12" fill="#1A1B26" stroke="#7AA2F7" stroke-width="2"/>
  <rect x="12" y="12" width="276" height="160" rx="8" fill="#24283B"/>
  <text x="24" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A9B1D6">~/src ❯ git log --oneline -2</text>
  <text x="24" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#565F89">c380bcf the session list</text>
  <text x="24" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#565F89">2150760 a picture of it</text>
  <text x="24" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A9B1D6">~/src ❯ ls ~/src/</text>
  <rect x="157" y="114" width="7" height="13" rx="0" fill="#A9B1D6"/>
  <text x="24" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7AA2F7">ok</text>
  <rect x="12" y="180" width="41" height="34" rx="6" fill="#24283B"/>
  <rect x="59" y="180" width="41" height="34" rx="6" fill="#24283B"/>
  <rect x="106" y="180" width="41" height="34" rx="6" fill="#24283B"/>
  <rect x="153" y="180" width="41" height="34" rx="6" fill="#24283B"/>
  <rect x="200" y="180" width="41" height="34" rx="6" fill="#24283B"/>
  <rect x="247" y="180" width="41" height="34" rx="6" fill="#24283B"/>
  <text x="23" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#A9B1D6">RUN</text>
  <rect x="74.5" y="192" width="10" height="10" rx="1.5" fill="#A9B1D6"/>
  <path d="M121.5 203 l7 -10 M127.5 191 l4 3 l-6 9 l-5 -3 z" fill="none" stroke="#A9B1D6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M166.5 191 h14 v12 h-14 z M169.5 195 l3 2 l-3 2 M174.5 200 h3" fill="none" stroke="#A9B1D6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M214.5 193 h12 M214.5 197 h12 M214.5 201 h12" fill="none" stroke="#A9B1D6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M262.5 192 l10 10 M272.5 192 l-10 10" fill="none" stroke="#A9B1D6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="12" y="224" width="64" height="26" rx="6" fill="#24283B"/>
  <text x="44" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#A9B1D6" text-anchor="middle">1 ~/src</text>
  <rect x="82" y="224" width="64" height="26" rx="6" fill="#1A1B26"/>
  <text x="114" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#565F89" text-anchor="middle">2 etc</text>
  <rect x="152" y="224" width="64" height="26" rx="6" fill="#1A1B26"/>
  <text x="184" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#565F89" text-anchor="middle">3 ~</text>
  <rect x="222" y="224" width="64" height="26" rx="6" fill="#1A1B26"/>
  <text x="254" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#565F89" text-anchor="middle">4</text>
  </g>
</svg>
