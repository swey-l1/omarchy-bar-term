<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="204" viewBox="0 0 1200 204" role="img" aria-labelledby="title">
  <title id="title">what the widget runs, by hand</title>
  <rect x="0" y="0" width="1200" height="204" rx="18" fill="#1A1B26"/>
  <rect x="0" y="0" width="1200" height="46" rx="18" fill="#24283B"/>
  <rect x="0" y="28" width="1200" height="18" rx="0" fill="#24283B"/>
  <text x="40" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#565F89">bash · what the widget runs, by hand</text>
  <text x="40" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7AA2F7">$</text>
  <text x="62" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C0CAF5" xml:space="preserve">bar-term list</text>
  <text x="40" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7AA2F7">$</text>
  <text x="62" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C0CAF5" xml:space="preserve">bar-term send bar-term-1 'ls -la'</text>
  <text x="40" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7AA2F7">$</text>
  <text x="62" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C0CAF5" xml:space="preserve">bar-term capture bar-term-1 40</text>
  <text x="40" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7AA2F7">$</text>
  <text x="62" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C0CAF5" xml:space="preserve">bar-term states bar-term-1 notes</text>
</svg>
